<text x='478' y='92' font-family='-apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='15' font-weight='600' fill='#1f2328'>×10 turns the wheel one step</text>
<text x='478' y='111' font-family='-apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='14' fill='#1f2328'>1 → 3 → 2 → 6 → 4 → 5 → 1: the remainders</text>
<text x='478' y='130' font-family='-apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='14' fill='#1f2328'>of 1, 10, 100, 1000, … on division by 7</text>
<text x='478' y='163' font-family='-apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='15' font-weight='600' fill='#1f2328'>Half a turn is the flip</text>
<text x='478' y='182' font-family='-apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='14' fill='#1f2328'>k goes to 7 − k, and each digit d to 9 − d:</text>
<text x='478' y='201' font-family='-apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='14' fill='#1f2328'>142 + 857 = 999</text>
<text x='478' y='234' font-family='-apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='15' font-weight='600' fill='#1f2328'>Two steps stay on one triangle</text>
<text x='478' y='253' font-family='-apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='14' fill='#1f2328'>the squares mod 7, 1, 2, 4 (solid),</text>
<text x='478' y='272' font-family='-apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='14' fill='#1f2328'>or 3, 5, 6 (dashed)</text>
<text x='478' y='305' font-family='-apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='15' font-weight='600' fill='#1f2328'>In space</text>
<text x='478' y='324' font-family='-apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='14' fill='#1f2328'>the hexagon is an octahedron's six corners</text>
<text x='478' y='343' font-family='-apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='14' fill='#1f2328'>seen down an axis; the triangles are two</text>
<text x='478' y='362' font-family='-apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='14' fill='#1f2328'>opposite faces, and 0/7 sits at the centre</text>
</svg>
