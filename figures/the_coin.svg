<text x='393.9' y='258.5' text-anchor='middle' font-family='-apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='17' font-style='normal' font-weight='600' fill='#1f2328'>1</text>
<text x='106.1' y='197.5' text-anchor='middle' font-family='-apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='17' font-style='normal' font-weight='600' fill='#1f2328'>−1</text>
<text x='352.0' y='180.4' text-anchor='middle' font-family='-apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='17' font-style='italic' font-weight='600' fill='#1f2328'>i</text>
<text x='148.0' y='275.6' text-anchor='middle' font-family='-apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='17' font-style='italic' font-weight='600' fill='#1f2328'>−i</text>
<circle cx='250' cy='222' r='5' fill='white' stroke='#1f2328' stroke-width='1.4'/>
<rect x='470' y='81' width='14' height='14' rx='3' fill='#c0392b'/>
<text x='494' y='94' font-family='-apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='15' font-weight='600' fill='#1f2328'>z → −z   <tspan font-weight='400' fill='#8c959f'>· positive and negative</tspan></text>
<text x='494' y='116' font-family='-apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='14' fill='#1f2328'>edge: keeps 0 and ∞</text>
<text x='494' y='136' font-family='-apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='14' fill='#1f2328'>sides: swaps 1 with −1, i with −i</text>
<rect x='470' y='165' width='14' height='14' rx='3' fill='#2471a3'/>
<text x='494' y='178' font-family='-apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='15' font-weight='600' fill='#1f2328'>z → 1/z   <tspan font-weight='400' fill='#8c959f'>· finite and infinite</tspan></text>
<text x='494' y='200' font-family='-apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='14' fill='#1f2328'>edge: keeps 1 and −1</text>
<text x='494' y='220' font-family='-apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='14' fill='#1f2328'>sides: swaps 0 with ∞, i with −i</text>
<rect x='470' y='249' width='14' height='14' rx='3' fill='#1e8449'/>
<text x='494' y='262' font-family='-apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='15' font-weight='600' fill='#1f2328'>z → −1/z   <tspan font-weight='400' fill='#8c959f'>· both at once</tspan></text>
<text x='494' y='284' font-family='-apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='14' fill='#1f2328'>edge: keeps i and −i (no real number)</text>
<text x='494' y='304' font-family='-apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='14' fill='#1f2328'>sides: swaps 0 with ∞, 1 with −1</text>
<text x='470' y='352' font-family='-apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='13' fill='#8c959f'>The centre (open dot) is kept by all three flips —</text>
<text x='470' y='370' font-family='-apple-system, Segoe UI, Helvetica, Arial, sans-serif' font-size='13' fill='#8c959f'>a void that no number occupies.</text>
</svg>
