<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 862" width="900" height="862" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="The alphabet of pre-physics: a thickened Venn of three research worlds — dynamics, spectra, arithmetic — with the shared modular-group nucleus at the center and the rigor of each overlap marked.">
<title>The alphabet of pre-physics</title>
<desc>Three overlapping worlds — dynamics and flows, quantum and spectra, arithmetic and geometry. Each region holds several objects. The overlaps: trace formula (theorem, dynamics-spectra), zeros=spectrum (conjecture, spectra-arithmetic), modular knots = Farey (theorem + frontier, dynamics-arithmetic). The shared center is a nucleus SL(2,Z) wrapped by primes, zeta and L-functions. Upright text = theorem; italic = conjecture or frontier.</desc>
<rect x="1.5" y="1.5" width="897" height="859" rx="14" fill="#FAF9F5" stroke="#D3D1C7" stroke-width="1"/>
<text x="450" y="42" text-anchor="middle" font-size="22" font-weight="600" fill="#2C2C2A">the alphabet of pre-physics</text>
<text x="450" y="66" text-anchor="middle" font-size="13" fill="#5F5E5A">where the number-theory and physics programs overlap — thickened, and with the rigor of each edge marked</text>
<circle cx="52" cy="98" r="6" fill="#7F77DD"/>
<text x="66" y="102" font-size="13.5" font-weight="600" fill="#3C3489">dynamics &amp; flows</text>
<text x="252" y="102" font-size="12" fill="#5F5E5A">Arnold · Ghys · Migdal</text>
<circle cx="52" cy="122" r="6" fill="#1D9E75"/>
<text x="66" y="126" font-size="13.5" font-weight="600" fill="#0F6E56">quantum &amp; spectra</text>
<text x="252" y="126" font-size="12" fill="#5F5E5A">Berry–Keating · Montgomery–Odlyzko · Sarnak</text>
<circle cx="52" cy="146" r="6" fill="#D85A30"/>
<text x="66" y="150" font-size="13.5" font-weight="600" fill="#993C1D">arithmetic &amp; geometry</text>
<text x="252" y="150" font-size="12" fill="#5F5E5A">Connes–Marcolli · Mazur–Morishita · Dragovich</text>
<text x="66" y="172" font-size="12" font-style="italic" fill="#888780">upright = theorem      ·      italic = conjecture / frontier</text>
<circle cx="330" cy="400" r="205" fill="#7F77DD" fill-opacity="0.15" stroke="#534AB7" stroke-width="1.5"/>
<circle cx="570" cy="400" r="205" fill="#1D9E75" fill-opacity="0.15" stroke="#0F6E56" stroke-width="1.5"/>
<circle cx="450" cy="590" r="205" fill="#D85A30" fill-opacity="0.15" stroke="#993C1D" stroke-width="1.5"/>
<text x="215" y="362" text-anchor="middle" font-size="14" fill="#2C2C2A">Arnold tongues</text>
<text x="215" y="380" text-anchor="middle" font-size="11.5" fill="#5F5E5A">mode-locking · circle map</text>
<text x="215" y="396" text-anchor="middle" font-size="11.5" fill="#5F5E5A">devil's staircase</text>
<text x="215" y="412" text-anchor="middle" font-size="11.5" fill="#5F5E5A">Lorenz / turbulence loops</text>
<text x="686" y="362" text-anchor="middle" font-size="14" fill="#2C2C2A">GUE / random matrices</text>
<text x="686" y="380" text-anchor="middle" font-size="11.5" fill="#5F5E5A">quantum chaos</text>
<text x="686" y="396" text-anchor="middle" font-size="11.5" fill="#5F5E5A">level repulsion</text>
<text x="686" y="412" text-anchor="middle" font-size="11.5" font-style="italic" fill="#5F5E5A">Weyl law · trace of e^(−itH)</text>
<text x="450" y="690" text-anchor="middle" font-size="14" fill="#2C2C2A">adeles · p-adic physics</text>
<text x="450" y="706" text-anchor="middle" font-size="11.5" fill="#5F5E5A">Langlands · L-functions</text>
<text x="450" y="722" text-anchor="middle" font-size="11.5" fill="#5F5E5A">sums of two squares (Fermat)</text>
<text x="450" y="738" text-anchor="middle" font-size="11.5" fill="#5F5E5A">Bost–Connes: ζ = partition fn</text>
<text x="450" y="288" text-anchor="middle" font-size="14.5" font-weight="600" fill="#2C2C2A">trace formula</text>
<text x="450" y="304" text-anchor="middle" font-size="11.5" fill="#5F5E5A">Selberg · Gutzwiller</text>
<text x="450" y="320" text-anchor="middle" font-size="11.5" fill="#5F5E5A">orbits = eigenvalues</text>
<text x="332" y="528" text-anchor="middle" font-size="14" font-weight="600" fill="#2C2C2A">Ghys: modular knots</text>
<text x="332" y="544" text-anchor="middle" font-size="11.5" fill="#5F5E5A">= Lorenz knots · Rademacher</text>
<text x="332" y="560" text-anchor="middle" font-size="11.5" fill="#5F5E5A">continued fractions</text>
<text x="332" y="576" text-anchor="middle" font-size="11.5" font-style="italic" fill="#5F5E5A">Migdal: turbulence → Farey</text>
<text x="572" y="528" text-anchor="middle" font-size="14.5" font-weight="600" font-style="italic" fill="#2C2C2A">zeros = spectrum</text>
<text x="572" y="544" text-anchor="middle" font-size="11.5" font-style="italic" fill="#5F5E5A">Hilbert–Pólya</text>
<text x="572" y="560" text-anchor="middle" font-size="11.5" font-style="italic" fill="#5F5E5A">Berry–Keating H = xp</text>
<text x="572" y="576" text-anchor="middle" font-size="11.5" font-style="italic" fill="#5F5E5A">Montgomery–Odlyzko GUE</text>
<circle cx="450" cy="452" r="41" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.2"/>
<text x="450" y="450" text-anchor="middle" font-size="15" font-weight="600" fill="#26215C">SL(2,ℤ)</text>
<text x="450" y="465" text-anchor="middle" font-size="10" fill="#5F5E5A">modular group</text>
<text x="450" y="510" text-anchor="middle" font-size="12" font-weight="600" fill="#26215C">primes · ζ · L-functions</text>
<text x="450" y="836" text-anchor="middle" font-size="11.5" fill="#888780">the center is the shared, pre-physical alphabet · the trace formula is the grammar that translates one side into the other</text>
</svg>
