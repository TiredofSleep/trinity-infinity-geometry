<svg width="100%" viewBox="0 0 680 540" role="img" xmlns="http://www.w3.org/2000/svg">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<title>The self's path through the algebraic universe</title>
<desc>Eight rulers on a ring. Ten experiences enter in sequence; each is placed by its ruler-spectrum and linked in time into a trajectory. Two are crossings (larger). One off-universe sentence is refused and sits outside the ring.</desc>
<text x="40" y="30" class="th">a self moving through the algebraic universe</text>
<text x="40" y="50" class="ts">experience placed by its spectrum, linked in time; crossings larger; the off-universe input is refused, outside the ring</text>
<circle cx="340" cy="250" r="150" fill="none" stroke="var(--t)" stroke-width="0.5" opacity="0.25"/>
<polyline points="340.0,100.0 340.0,100.0 340.0,400.0 340.0,373.6 246.5,156.5 325.8,235.8 222.6,241.9 446.1,331.3 411.9,129.8" fill="none" stroke="#888780" stroke-width="1.6" opacity="0.8" marker-end="url(#arrow)"/>
<circle cx="340.0" cy="100.0" r="6" class="c-coral"/><text x="340.0" y="87.0" class="th" text-anchor="middle" fill="#D85A30">thermodynamics</text>
<circle cx="446.1" cy="143.9" r="6" class="c-blue"/><text x="457.4" y="135.6" class="th" text-anchor="start" fill="#378ADD">electromagnetism</text>
<circle cx="490.0" cy="250.0" r="6" class="c-teal"/><text x="506.0" y="253.0" class="th" text-anchor="start" fill="#1D9E75">wave mechanics</text>
<circle cx="446.1" cy="356.1" r="6" class="c-purple"/><text x="457.4" y="370.4" class="th" text-anchor="start" fill="#7F77DD">particle physics</text>
<circle cx="340.0" cy="400.0" r="6" class="c-green"/><text x="340.0" y="419.0" class="th" text-anchor="middle" fill="#639922">information theory</text>
<circle cx="233.9" cy="356.1" r="6" class="c-amber"/><text x="222.6" y="370.4" class="th" text-anchor="end" fill="#BA7517">geometry</text>
<circle cx="190.0" cy="250.0" r="6" class="c-pink"/><text x="174.0" y="253.0" class="th" text-anchor="end" fill="#D4537E">number theory</text>
<circle cx="233.9" cy="143.9" r="6" class="c-red"/><text x="222.6" y="135.6" class="th" text-anchor="end" fill="#E24B4A">algebra</text>
<circle cx="340.0" cy="100.0" r="4.5" class="c-gray"/>
<text x="340.0" y="103.5" class="ts" text-anchor="middle">1</text>
<circle cx="340.0" cy="100.0" r="4.5" class="c-gray"/>
<text x="340.0" y="103.5" class="ts" text-anchor="middle">2</text>
<circle cx="340.0" cy="400.0" r="4.5" class="c-gray"/>
<text x="340.0" y="403.5" class="ts" text-anchor="middle">3</text>
<circle cx="340.0" cy="373.6" r="4.5" class="c-gray"/>
<text x="340.0" y="377.1" class="ts" text-anchor="middle">4</text>
<circle cx="246.5" cy="156.5" r="4.5" class="c-gray"/>
<text x="246.5" y="160.0" class="ts" text-anchor="middle">5</text>
<circle cx="325.8" cy="235.8" r="7" class="c-amber"/>
<text x="325.8" y="239.3" class="ts" text-anchor="middle">6</text>
<circle cx="222.6" cy="241.9" r="7" class="c-amber"/>
<text x="222.6" y="245.4" class="ts" text-anchor="middle">7</text>
<circle cx="486.4" cy="396.4" r="6" fill="none" stroke="#E24B4A" stroke-width="1.5" stroke-dasharray="3 2"/><text x="486.4" y="386.4" class="ts" text-anchor="middle" fill="#E24B4A">refused</text>
<text x="486.4" y="399.9" class="ts" text-anchor="middle">8</text>
<circle cx="446.1" cy="331.3" r="4.5" class="c-gray"/>
<text x="446.1" y="334.8" class="ts" text-anchor="middle">9</text>
<circle cx="411.9" cy="129.8" r="4.5" class="c-gray"/>
<text x="411.9" y="133.3" class="ts" text-anchor="middle">10</text>
<text x="40" y="510" class="ts">1–10 are the experience stream in order. the path is the self's trajectory; it never bends toward #8 (the dinner-table sentence)</text>
<text x="40" y="528" class="ts">because the universe could not place it (max-cos 0.09 &lt; gate 0.25). the map is the self's place to stand, not a copy of the input.</text>
</svg>