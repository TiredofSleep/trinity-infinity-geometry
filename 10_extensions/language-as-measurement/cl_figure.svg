<svg width="100%" viewBox="0 0 680 372" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Split-CIFAR-100 class-incremental: our prototype method vs standard baselines</title>
<desc>Final class-incremental accuracy on Split-CIFAR-100 (10 tasks, frozen ResNet-18, mean of 3 seeds). NCM (ours) reaches 0.53, far above Fine-tune 0.13, EWC 0.14, ER 0.22, and within 0.14 of the Joint upper bound 0.66.</desc>
<text x="40" y="30" class="th">Split-CIFAR-100 class-incremental — our method vs standard CL baselines</text>
<text x="40" y="50" class="ts">final accuracy on all 100 classes after 10 tasks, frozen ResNet-18, mean of 3 seeds (NCM std ~0.000). higher = better</text>
<line x1="90" y1="330.0" x2="620" y2="330.0" stroke="var(--t)" stroke-width="0.5" opacity="0.18"/><text x="84" y="334.0" class="ts" text-anchor="end">0.00</text><line x1="90" y1="250.0" x2="620" y2="250.0" stroke="var(--t)" stroke-width="0.5" opacity="0.18"/><text x="84" y="254.0" class="ts" text-anchor="end">0.25</text><line x1="90" y1="170.0" x2="620" y2="170.0" stroke="var(--t)" stroke-width="0.5" opacity="0.18"/><text x="84" y="174.0" class="ts" text-anchor="end">0.50</text><line x1="90" y1="90.0" x2="620" y2="90.0" stroke="var(--t)" stroke-width="0.5" opacity="0.18"/><text x="84" y="94.0" class="ts" text-anchor="end">0.75</text>
<line x1="90" y1="117.8" x2="620" y2="117.8" stroke="#888780" stroke-width="1" stroke-dasharray="4 3"/>
<rect x="111.2" y="286.8" width="63.6" height="43.2" fill="#D85A30" opacity="0.9" rx="2"/><text x="143.0" y="280.8" class="ts" text-anchor="middle">0.13</text><text x="143.0" y="346.0" class="ts" text-anchor="middle">Fine-tune</text><rect x="217.2" y="286.5" width="63.6" height="43.5" fill="#D85A30" opacity="0.9" rx="2"/><text x="249.0" y="280.5" class="ts" text-anchor="middle">0.14</text><text x="249.0" y="346.0" class="ts" text-anchor="middle">EWC</text><rect x="323.2" y="258.1" width="63.6" height="71.9" fill="#D85A30" opacity="0.9" rx="2"/><text x="355.0" y="252.1" class="ts" text-anchor="middle">0.22</text><text x="355.0" y="346.0" class="ts" text-anchor="middle">ER (replay)</text><rect x="429.2" y="161.8" width="63.6" height="168.2" fill="#1D9E75" opacity="0.9" rx="2"/><text x="461.0" y="155.8" class="ts" text-anchor="middle">0.53</text><text x="461.0" y="346.0" class="ts" text-anchor="middle">NCM (ours)</text><rect x="535.2" y="117.8" width="63.6" height="212.2" fill="#888780" opacity="0.9" rx="2"/><text x="567.0" y="111.8" class="ts" text-anchor="middle">0.66</text><text x="567.0" y="346.0" class="ts" text-anchor="middle">Joint (upper bd)</text>
<text x="40" y="358" class="ts">NCM (ours) is replay-free, training-free, interpretable; beats Fine-tune/EWC/ER by a wide margin, near-zero forgetting (0.12 vs 0.67–0.82). Frozen-backbone CL setting.</text>
</svg>