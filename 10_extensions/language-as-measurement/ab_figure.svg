<svg width="100%" viewBox="0 0 680 380" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Adam vs Muon: the geometry-aware optimizer teaches faster</title>
<desc>Validation perplexity versus training step for a fixed 3-layer model trained on the book corpus, identical except for the optimizer. Muon (geometry-aware) is below Adam at every step, reaching Adam's final perplexity about 2.5x sooner.</desc>
<text x="40" y="30" class="th">Adam vs Muon — measured, same model, same data, only the optimizer differs</text>
<text x="40" y="50" class="ts">val perplexity vs step on the 795M-token book corpus; lower is better</text>
