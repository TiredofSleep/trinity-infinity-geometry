<polyline points="120.0,233.4 240.0,176.0 360.0,155.8 480.0,128.8 600.0,112.0" fill="none" stroke="#1D9E75" stroke-width="2"/><circle cx="120.0" cy="233.4" r="3" fill="#1D9E75"/><circle cx="240.0" cy="176.0" r="3" fill="#1D9E75"/><circle cx="360.0" cy="155.8" r="3" fill="#1D9E75"/><circle cx="480.0" cy="128.8" r="3" fill="#1D9E75"/><circle cx="600.0" cy="112.0" r="3" fill="#1D9E75"/>
