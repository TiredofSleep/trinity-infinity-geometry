<svg width="100%" viewBox="0 0 680 430" role="img" xmlns="http://www.w3.org/2000/svg">
<title>The combined map rides the best-available paradigm</title>
<desc>Accuracy versus examples per class for three single mathematical lenses (semantic anchor, data manifold, relational graph) and the reliability-weighted fusion of them. The anchor lens leads when data is scarce; the data and graph lenses catch up and overtake as examples grow; the fusion tracks whichever is best and pulls ahead once they are comparable.</desc>
<text x="40" y="30" class="th">information as a path across substrates — the whole rides the best part</text>
<text x="40" y="50" class="ts">8-way task, 80 splits. three different math paradigms as lenses + their reliability-weighted fusion. y = accuracy, x = examples/class</text>
<line x1="120" y1="350.0" x2="600" y2="350.0" stroke="var(--t)" stroke-width="0.5" opacity="0.18"/><text x="112" y="354.0" class="ts" text-anchor="end">0.5</text><line x1="120" y1="282.5" x2="600" y2="282.5" stroke="var(--t)" stroke-width="0.5" opacity="0.18"/><text x="112" y="286.5" class="ts" text-anchor="end">0.6</text><line x1="120" y1="215.0" x2="600" y2="215.0" stroke="var(--t)" stroke-width="0.5" opacity="0.18"/><text x="112" y="219.0" class="ts" text-anchor="end">0.7</text><line x1="120" y1="147.5" x2="600" y2="147.5" stroke="var(--t)" stroke-width="0.5" opacity="0.18"/><text x="112" y="151.5" class="ts" text-anchor="end">0.8</text><line x1="120" y1="80.0" x2="600" y2="80.0" stroke="var(--t)" stroke-width="0.5" opacity="0.18"/><text x="112" y="84.0" class="ts" text-anchor="end">0.9</text>
<text x="120.0" y="368.0" class="ts" text-anchor="middle">1</text><text x="240.0" y="368.0" class="ts" text-anchor="middle">2</text><text x="360.0" y="368.0" class="ts" text-anchor="middle">3</text><text x="480.0" y="368.0" class="ts" text-anchor="middle">5</text><text x="600.0" y="368.0" class="ts" text-anchor="middle">8</text>
<text x="360" y="384" class="ts" text-anchor="middle">examples per class (k)</text>
<polyline points="120.0,106.8 240.0,107.6 360.0,108.0 480.0,106.5 600.0,106.4" fill="none" stroke="#D85A30" stroke-width="2"/><circle cx="120.0" cy="106.8" r="3" fill="#D85A30"/><circle cx="240.0" cy="107.6" r="3" fill="#D85A30"/><circle cx="360.0" cy="108.0" r="3" fill="#D85A30"/><circle cx="480.0" cy="106.5" r="3" fill="#D85A30"/><circle cx="600.0" cy="106.4" r="3" fill="#D85A30"/>
