<svg width="100%" viewBox="0 0 680 458" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Few-shot learning curves: the algebra as a prior beats data-only</title>
<desc>Accuracy versus number of training examples per domain. Data-only prototypes start at 0.57 at one example; algebra-plus-data start at 0.82; a description-only anchor with zero examples sits near 0.86 across the board. The gap is largest when examples are scarce and narrows as they accumulate.</desc>
<text x="40" y="30" class="th">the algebra is the head start — few-shot learning curves</text>
<text x="40" y="50" class="ts">8-way domain task, cosine nearest-prototype in raw 384-d, 80 splits. y = accuracy, x = labeled examples per domain</text>
<line x1="110" y1="360.0" x2="600" y2="360.0" stroke="var(--t)" stroke-width="0.5" opacity="0.18"/><text x="102" y="364.0" class="ts" text-anchor="end">0.00</text><line x1="110" y1="325.0" x2="600" y2="325.0" stroke="var(--t)" stroke-width="0.5" opacity="0.18"/><text x="102" y="329.0" class="ts" text-anchor="end">0.12</text><line x1="110" y1="290.0" x2="600" y2="290.0" stroke="var(--t)" stroke-width="0.5" opacity="0.18"/><text x="102" y="294.0" class="ts" text-anchor="end">0.25</text><line x1="110" y1="220.0" x2="600" y2="220.0" stroke="var(--t)" stroke-width="0.5" opacity="0.18"/><text x="102" y="224.0" class="ts" text-anchor="end">0.50</text><line x1="110" y1="150.0" x2="600" y2="150.0" stroke="var(--t)" stroke-width="0.5" opacity="0.18"/><text x="102" y="154.0" class="ts" text-anchor="end">0.75</text><line x1="110" y1="80.0" x2="600" y2="80.0" stroke="var(--t)" stroke-width="0.5" opacity="0.18"/><text x="102" y="84.0" class="ts" text-anchor="end">1.00</text><line x1="110" y1="325.0" x2="600" y2="325.0" stroke="#888780" stroke-width="1" stroke-dasharray="2 3"/>
<text x="110.0" y="378.0" class="ts" text-anchor="middle">1</text><text x="232.5" y="378.0" class="ts" text-anchor="middle">2</text><text x="355.0" y="378.0" class="ts" text-anchor="middle">3</text><text x="477.5" y="378.0" class="ts" text-anchor="middle">5</text><text x="600.0" y="378.0" class="ts" text-anchor="middle">8</text>
<text x="355" y="394" class="ts" text-anchor="middle">examples per domain (k)</text>
<polyline points="110.0,119.0 232.5,119.6 355.0,119.1 477.5,119.8 600.0,118.8" fill="none" stroke="#888780" stroke-width="2" stroke-dasharray="5 4"/><circle cx="110.0" cy="119.0" r="3.5" fill="#888780"/><circle cx="232.5" cy="119.6" r="3.5" fill="#888780"/><circle cx="355.0" cy="119.1" r="3.5" fill="#888780"/><circle cx="477.5" cy="119.8" r="3.5" fill="#888780"/><circle cx="600.0" cy="118.8" r="3.5" fill="#888780"/>
<polyline points="110.0,200.5 232.5,157.9 355.0,141.2 477.5,127.2 600.0,119.1" fill="none" stroke="#D85A30" stroke-width="2"/><circle cx="110.0" cy="200.5" r="3.5" fill="#D85A30"/><circle cx="232.5" cy="157.9" r="3.5" fill="#D85A30"/><circle cx="355.0" cy="141.2" r="3.5" fill="#D85A30"/><circle cx="477.5" cy="127.2" r="3.5" fill="#D85A30"/><circle cx="600.0" cy="119.1" r="3.5" fill="#D85A30"/>
<polyline points="110.0,130.5 232.5,122.1 355.0,117.2 477.5,114.6 600.0,111.9" fill="none" stroke="#1D9E75" stroke-width="2"/><circle cx="110.0" cy="130.5" r="3.5" fill="#1D9E75"/><circle cx="232.5" cy="122.1" r="3.5" fill="#1D9E75"/><circle cx="355.0" cy="117.2" r="3.5" fill="#1D9E75"/><circle cx="477.5" cy="114.6" r="3.5" fill="#1D9E75"/><circle cx="600.0" cy="111.9" r="3.5" fill="#1D9E75"/>
<line x1="110.0" y1="200.5" x2="110.0" y2="130.5" stroke="#1D9E75" stroke-width="1" stroke-dasharray="2 2"/><text x="118.0" y="169.5" class="ts" fill="#1D9E75">+0.25</text>
<circle cx="120" cy="414" r="4" fill="#D85A30"/><text x="130" y="418" class="ts">data-only (baseline)</text>
<circle cx="300" cy="414" r="4" fill="#1D9E75"/><text x="310" y="418" class="ts">algebra + data (ours)</text>
<circle cx="470" cy="414" r="4" fill="#888780"/><text x="480" y="418" class="ts">description only (0 examples)</text>
<text x="40" y="442" class="ts">the description-only anchor (zero labels) beats data-only prototypes at every k — the algebra is worth the examples it replaces.</text>
</svg>